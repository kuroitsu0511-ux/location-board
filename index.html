<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位置情報メッセージボード</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#121214',
                        card: '#1a1a1e',
                        primary: '#6366f1',
                        'primary-hover': '#4f46e5',
                    }
                }
            }
        }
    </script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { background-color: #121214; color: #f3f4f6; }
        /* Leafletのダークモード風調整 */
        .leaflet-container { background-color: #1a1a1e !important; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- ヘッダー -->
    <header class="bg-card border-b border-gray-800 px-6 py-4 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-primary p-2 rounded-xl text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-lg text-white">位置情報メッセージボード</h1>
                <p class="text-xs text-gray-400">いま、この瞬間の声をマップに残そう</p>
            </div>
        </div>
        <button id="open-modal-btn" class="bg-primary hover:bg-primary-hover text-white text-sm font-semibold px-5 py-2.5 rounded-xl shadow-lg transition flex items-center space-x-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span>メッセージを投稿</span>
        </button>
    </header>

    <!-- メインコンテンツ（マップ＆サイドパネル） -->
    <div class="flex-1 flex relative overflow-hidden">
        <!-- マップ表示エリア -->
        <div id="map" class="flex-1 h-full z-10"></div>
    </div>

    <!-- 投稿モーダル -->
    <div id="post-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-card border border-gray-800 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <!-- モーダルヘッダー -->
            <div class="px-6 py-4 border-b border-gray-800 flex items-center justify-between">
                <h2 class="font-bold text-base text-white">新しいメッセージを投稿</h2>
                <button id="close-modal-btn" class="text-gray-400 hover:text-white transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- モーダルボディ -->
            <div class="p-6 overflow-y-auto space-y-5">
                <form id="post-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">お名前 / ニックネーム</label>
                        <input type="text" id="username" required placeholder="例: たろう" class="w-full bg-dark border border-gray-800 rounded-xl p-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-primary transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">メッセージ</label>
                        <textarea id="message" required rows="3" placeholder="いまどんな気分？何してる？" class="w-full bg-dark border border-gray-800 rounded-xl p-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-primary transition resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">共有する単位（精度・範囲）</label>
                        <select id="precision" class="w-full bg-dark border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-primary transition">
                            <option value="exact">正確な現在地（ピンポイント）</option>
                            <option value="radius_3km" selected>今いる場所から半径約 3km圏内</option>
                            <option value="city">住んでいる「市区町村」単位</option>
                            <option value="prefecture">住んでいる「都道府県」単位</option>
                        </select>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full bg-primary hover:bg-primary-hover text-white font-semibold py-3 rounded-xl transition shadow-lg">
                            投稿する
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- アプリケーションスクリプト -->
    <script>
        let map;
        let markersLayer = L.layerGroup();
        let tempLatLng = null;

        // 初期化処理
        document.addEventListener('DOMContentLoaded', () => {
            // マップの初期化（東京を中心に設定）
            map = L.map('map', { zoomControl: false }).setView([35.6812, 139.7671], 13);

            // ダークテーマのタイルレイヤー (CartoDB Dark Matter)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_3i4o_1_1bba2c9981a1808fd07c1ccc', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            // ズームコントロールを右上に移動
            L.control.zoom({ position: 'topright' }).addTo(map);

            markersLayer.addTo(map);

            // 投稿データの読み込み
            loadPosts();

            // モーダル開閉イベント
            const modal = document.getElementById('post-modal');
            document.getElementById('open-modal-btn').addEventListener('click', () => {
                // 現在地を取得してモーダルを開く
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            tempLatLng = {
                                lat: position.coords.latitude,
                                lng: position.coords.longitude
                            };
                            modal.classList.remove('hidden');
                        },
                        (error) => {
                            alert("位置情報の取得に失敗しました。ブラウザの設定を確認してください。");
                        },
                        { enableHighAccuracy: true }
                    );
                } else {
                    alert("お使いのブラウザは位置情報に対応していません。");
                }
            });

            document.getElementById('close-modal-btn').addEventListener('click', () => {
                modal.classList.add('hidden');
            });

            // 投稿フォーム送信処理
            document.getElementById('post-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                if (!tempLatLng) return;

                let lat = tempLatLng.lat;
                let lng = tempLatLng.lng;
                const precision = document.getElementById('precision').value;
                let targetZoom = 15;
                
                if (precision === 'radius_3km') {
                    // 半径約3km圏内にランダムにオフセットを入れる計算
                    const radiusKm = 3;
                    const r = radiusKm * Math.sqrt(Math.random()); // 面積均等に散らす
                    const theta = Math.random() * 2 * Math.PI;
                    
                    const deltaLat = (r * Math.cos(theta)) / 111;
                    const deltaLng = (r * Math.sin(theta)) / (111 * Math.cos(lat * Math.PI / 180));
                    
                    lat += deltaLat;
                    lng += deltaLng;
                    targetZoom = 13;

                } else if (precision === 'city' || precision === 'prefecture') {
                    try {
                        // 緯度経度から住所（都道府県・市区町村）を逆引きする無料API
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=12&accept-language=ja`);
                        const data = await res.json();
                        
                        if (data && data.address) {
                            const addr = data.address;
                            const prefecture = addr.province || addr.state || ""; // 県
                            const city = addr.city || addr.town || addr.village || addr.county || ""; // 市区町村
                            
                            let targetQuery = "";
                            if (precision === 'prefecture') {
                                targetQuery = prefecture;
                                targetZoom = 9;
                            } else {
                                targetQuery = `${prefecture} ${city}`;
                                targetZoom = 12;
                            }

                            if (targetQuery.trim()) {
                                // 取得できた県や市の正式な中心座標を検索してそこに合わせる
                                const searchRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(targetQuery)}&limit=1`);
                                const searchData = await searchRes.json();
                                
                                if (searchData && searchData.length > 0) {
                                    lat = parseFloat(searchData[0].lat);
                                    lng = parseFloat(searchData[0].lon);
                                }
                            }
                        }
                    } catch (err) {
                        console.warn("住所の自動取得に失敗したため、現在地をベースにした座標を使用します", err);
                    }
                }

                const newPost = {
                    id: String(Date.now()),
                    lat: lat,
                    lng: lng,
                    username: document.getElementById('username').value.trim(),
                    message: document.getElementById('message').value.trim(),
                    timestamp: new Date().toISOString()
                };

                try {
                    const res = await fetch('/api/posts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newPost)
                    });

                    if (res.ok) {
                        loadPosts();
                        map.flyTo([lat, lng], targetZoom);
                        modal.classList.add('hidden');
                        document.getElementById('post-form').reset();
                    } else {
                        alert("投稿の保存に失敗しました。");
                    }
                } catch (e) {
                    alert("通信エラーが発生しました。");
                }
            });
        });

        // 投稿一覧をサーバーから取得してマップに描画
        async function loadPosts() {
            try {
                const res = await fetch('/api/posts');
                if (!res.ok) return;
                const posts = await res.json();

                markersLayer.clearLayers();

                posts.forEach(post => {
                    const marker = L.marker([post.lat, post.lng]);
                    
                    const dateStr = new Date(post.timestamp).toLocaleString('ja-JP', {
                        month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    const popupContent = `
                        <div style="font-family: sans-serif; color: #111; min-width: 160px;">
                            <div style="font-weight: bold; font-size: 14px; margin-bottom: 4px;">${escapeHtml(post.username)}</div>
                            <div style="font-size: 13px; margin-bottom: 8px; word-break: break-all;">${escapeHtml(post.message)}</div>
                            <div style="font-size: 10px; color: #666; text-align: right;">${dateStr}</div>
                        </div>
                    `;

                    marker.bindPopup(popupContent);
                    markersLayer.addLayer(marker);
                });
            } catch (e) {
                console.error("投稿の読み込みに失敗しました", e);
            }
        }

        // 簡易的なHTMLエスケープ関数
        function escapeHtml(str) {
            return str.replace(/[&'`"<>]/g, function(match) {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '"': '&quot;',
                    '<': '&lt;',
                    '>': '&gt;',
                }[match];
            });
        }
    </script>
</body>
</html>
